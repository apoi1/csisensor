<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi-CSI Live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #10141c; color: #dfe6f1; font: 16px/1.4 system-ui, sans-serif;
         padding: 12px; max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c33; }
  .dot.on { background: #3c6; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
           gap: 10px; margin-bottom: 12px; }
  .tile { background: #1a2230; border-radius: 10px; padding: 10px 12px; }
  .tile .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: #8b98ab; }
  .tile .v { font-size: 1.6rem; font-weight: 700; }
  .tile .v small { font-size: .8rem; font-weight: 400; color: #8b98ab; }
  canvas { width: 100%; height: 130px; background: #1a2230; border-radius: 10px;
           margin-bottom: 10px; }
  .meta { color: #8b98ab; font-size: .78rem; }
  .warn { color: #e6b84c; }
</style>
</head>
<body>
<header>
  <h1>WiFi-CSI Live</h1>
  <span id="conn" class="dot"></span>
  <span id="fill" class="meta"></span>
</header>

<div class="tiles">
  <div class="tile"><div class="k">Heart</div><div class="v"><span id="heart">&ndash;</span> <small>bpm</small></div></div>
  <div class="tile"><div class="k">Respiration</div><div class="v"><span id="resp">&ndash;</span> <small>/min</small></div></div>
  <div class="tile"><div class="k">Body</div><div class="v"><span id="pres">&ndash;</span></div></div>
  <div class="tile"><div class="k">Distance</div><div class="v"><span id="dist">&ndash;</span> <small>m</small></div></div>
</div>

<canvas id="trend"></canvas>
<canvas id="wave"></canvas>

<p class="meta">Trend: last 10 min of estimates (blue = heart, green = respiration).
Waves: latest bandpass-filtered subcarrier signals.</p>
<p class="meta warn">Research/educational tool &mdash; not a medical device.</p>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var trend = $("trend"), wave = $("wave");
  var snap = null, retryMs = 1000;

  function fitCanvas(cv) {
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * dpr || cv.height !== h * dpr) {
      cv.width = w * dpr; cv.height = h * dpr;
    }
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function polyline(ctx, xs, ys, color, y0, y1) {
    var started = false, i;
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath();
    for (i = 0; i < xs.length; i++) {
      if (ys[i] === null || !isFinite(ys[i])) { started = false; continue; }
      var px = xs[i], py = cv_h - (ys[i] - y0) / (y1 - y0) * cv_h;
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }

  var cv_h; // current canvas css height, set in draw helpers

  function drawTrend() {
    if (!snap) return;
    var ctx = fitCanvas(trend);
    var w = trend.clientWidth, h = trend.clientHeight; cv_h = h;
    ctx.clearRect(0, 0, w, h);
    var hist = snap.history;
    if (!hist || hist.t.length < 2) return;
    var t0 = hist.t[0], t1 = Math.max(hist.t[hist.t.length - 1], t0 + 1);
    var xs = hist.t.map(function (t) { return (t - t0) / (t1 - t0) * w; });
    polyline(ctx, xs, hist.heart, "#5aa2ff", 30, 140);
    polyline(ctx, xs, hist.resp, "#3ce0a0", 0, 40);
    ctx.fillStyle = "#8b98ab";
    ctx.fillText("bpm 30\u2013140 (blue)  \u00b7  /min 0\u201340 (green)", 8, 12);
  }

  function drawWave() {
    if (!snap || !snap.wave) return;
    var ctx = fitCanvas(wave);
    var w = wave.clientWidth, h = wave.clientHeight; cv_h = h;
    ctx.clearRect(0, 0, w, h);
    var t = snap.wave.t, ht = snap.wave.heart, rp = snap.wave.resp;
    if (t.length < 2) return;
    var t0 = t[0], t1 = t[t.length - 1];
    var xs = t.map(function (v) { return (v - t0) / Math.max(t1 - t0, 1e-9) * w; });
    // split canvas: heart on top half, respiration on bottom half
    var i, seg;
    for (seg = 0; seg < 2; seg++) {
      var ys = (seg === 0) ? ht : rp;
      var lo = Infinity, hi = -Infinity;
      for (i = 0; i < ys.length; i++) {
        if (!isFinite(ys[i])) continue;
        lo = Math.min(lo, ys[i]); hi = Math.max(hi, ys[i]);
      }
      if (!isFinite(lo) || hi - lo < 1e-9) { lo = 0; hi = 1; }
      var base = seg * h / 2, half = h / 2;
      var segYs = ys.map(function (v) { return base + half - (v - lo) / (hi - lo) * (half - 6) - 3; });
      var started = false;
      ctx.strokeStyle = seg === 0 ? "#5aa2ff" : "#3ce0a0";
      ctx.lineWidth = 1.4; ctx.beginPath();
      for (i = 0; i < xs.length; i++) {
        if (!isFinite(ys[i])) { started = false; continue; }
        if (!started) { ctx.moveTo(xs[i], segYs[i]); started = true; }
        else ctx.lineTo(xs[i], segYs[i]);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "#8b98ab"; ctx.font = "10px system-ui";
    ctx.fillText("heart (filtered)", 8, 12);
    ctx.fillText("respiration (filtered)", 8, h / 2 + 12);
  }

  function fmt(v, digits) {
    return (v === null || v === undefined) ? "\u2013" : Number(v).toFixed(digits);
  }

  function render(s) {
    snap = s;
    $("heart").textContent = fmt(s.heart_bpm, 0);
    $("resp").textContent = fmt(s.resp_pm, 1);
    $("pres").textContent = s.presence || "\u2013";
    $("dist").textContent = s.distance_m === null ? "\u2013" : fmt(s.distance_m, 2);
    $("fill").textContent = "window " + Math.round(s.fill * 100) + "%" +
        "  \u00b7  SNR " + fmt(s.heart_snr_db, 1) + "/" + fmt(s.resp_snr_db, 1) + " dB" +
        "  \u00b7  RSSI " + (s.rssi_dbm === null ? "\u2013" : s.rssi_dbm + " dBm");
    drawTrend(); drawWave();
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws = new WebSocket(proto + location.host + "/ws");
    ws.onopen = function () { retryMs = 1000; $("conn").classList.add("on"); };
    ws.onmessage = function (ev) { render(JSON.parse(ev.data)); };
    ws.onclose = function () {
      $("conn").classList.remove("on");
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 15000);
    };
    ws.onerror = function () { ws.close(); };
  }

  window.addEventListener("resize", function () { drawTrend(); drawWave(); });
  connect();
})();
</script>
</body>
</html>
